<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22183d">
<title>Sin conexión · BS Marketing</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#22183d;color:#fff;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;text-align:center}
  img{width:96px;height:96px;border-radius:24px}
  h1{font-size:24px;margin:24px 0 8px;letter-spacing:-.02em}
  p{margin:0 auto;max-width:30ch;color:#c9c2e0;line-height:1.5}
  button{margin-top:24px;min-height:46px;padding:11px 22px;border:0;border-radius:999px;background:#ffd447;color:#22183d;font:inherit;font-weight:700;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>La app necesita internet para mostrar y guardar los datos. Revisá la conexión y probá de nuevo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
